name: Deploy To AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: todo-app
  ECS_CLUSTER: prod-cluster
  ECS_SERVICE: todo-app-service
  AWS_ACCOUNT_ID: 340010512290

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Register ECS task definition
        id: register-task
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --family todo-app-task \
            --network-mode host \
            --requires-compatibilities EC2 \
            --cpu 128 \
            --memory 256 \
            --task-role-arn "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole" \
            --execution-role-arn "arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole" \
            --container-definitions "[
              {
                \"name\": \"todo-app\",
                \"image\": \"$IMAGE_URI\",
                \"essential\": true,
                \"environment\": [
                  {\"name\": \"NODE_ENV\", \"value\": \"production\"},
                  {\"name\": \"AWS_REGION\", \"value\": \"us-east-1\"},
                  {\"name\": \"NODE_OPTIONS\", \"value\": \"--dns-result-order=ipv4first\"}
                ],
                \"secrets\": [
                  {
                    \"name\": \"DATABASE_URL\",
                    \"valueFrom\": \"arn:aws:ssm:us-east-1:${{ env.AWS_ACCOUNT_ID }}:parameter/todo-app-database-url\"
                  }
                ],
                \"logConfiguration\": {
                  \"logDriver\": \"awslogs\",
                  \"options\": {
                    \"awslogs-group\": \"/ecs/todo-app\",
                    \"awslogs-region\": \"us-east-1\",
                    \"awslogs-stream-prefix\": \"ecs\"
                  }
                }
              }
            ]" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "✅ Registered: $TASK_ARN"

      - name: Deploy to ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for stable deployment
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
          echo "✅ Service stable"

      - name: Verify deployment
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].{Running:runningCount,Desired:desiredCount,TaskDef:taskDefinition}' \
            --output table

      - name: Health check with retry
        run: |
          for i in 1 2 3 4 5 6; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://54.146.152.142:3001/health || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP — retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 6 attempts"
          aws logs tail /ecs/todo-app --since 5m || true
          exit 1

      - name: API smoke test
        run: |
          RESPONSE=$(curl -s http://54.146.152.142:3001/api/tasks)
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ API smoke test failed: $RESPONSE"
            exit 1
          fi
          echo "✅ API smoke test passed"
          echo "🚀 Live at: http://54.146.152.142:3001"
