name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: 340010512290.dkr.ecr.us-east-1.amazonaws.com/todo-app
  ECS_CLUSTER: prod-cluster
  ECS_SERVICE: todo-app-service
  ECS_TASK: todo-app-task

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}" >> ~/.aws/credentials
          echo "aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region = ${{ env.AWS_REGION }}" >> ~/.aws/config

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REPO }}

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.ECR_REPO }}:${{ github.sha }} \
            -t ${{ env.ECR_REPO }}:latest \
            .
          echo "✅ Docker build complete"

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REPO }}:${{ github.sha }}
          docker push ${{ env.ECR_REPO }}:latest
          echo "✅ Pushed to ECR"

      - name: Register task definition
        id: register
        run: |
          TASK_ARN=$(aws ecs register-task-definition \
            --family ${{ env.ECS_TASK }} \
            --network-mode host \
            --requires-compatibilities EC2 \
            --cpu 128 \
            --memory 256 \
            --task-role-arn arn:aws:iam::340010512290:role/ecsTaskRole \
            --execution-role-arn arn:aws:iam::340010512290:role/ecsTaskExecutionRole \
            --container-definitions "[{
              \"name\": \"todo-app\",
              \"image\": \"${{ env.ECR_REPO }}:${{ github.sha }}\",
              \"essential\": true,
              \"environment\": [
                {\"name\": \"NODE_ENV\", \"value\": \"production\"},
                {\"name\": \"AWS_REGION\", \"value\": \"us-east-1\"},
                {\"name\": \"NODE_OPTIONS\", \"value\": \"--dns-result-order=ipv4first\"}
              ],
              \"secrets\": [
                {\"name\": \"DATABASE_URL\", \"valueFrom\": \"arn:aws:ssm:us-east-1:340010512290:parameter/todo-app-database-url\"}
              ],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"/ecs/todo-app\",
                  \"awslogs-region\": \"us-east-1\",
                  \"awslogs-stream-prefix\": \"ecs\"
                }
              }
            }]" \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ Task registered: $TASK_ARN"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register.outputs.arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          echo "✅ ECS service updated"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} || true
          echo "✅ Service stable"

      - name: Health check
        run: |
          for i in {1..10}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              http://54.146.152.142:3001/health || echo "000")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "  Attempt $i: HTTP $HTTP"
            sleep 5
          done
          echo "⚠️ Health check timed out (but deployment may still be starting)"
