name: Build Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t todo-app:latest . && docker run --rm -d -p 3001:3001 --name test todo-app:latest && sleep 3 && docker logs test && docker rm -f test || true